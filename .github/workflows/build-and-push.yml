name: Build and Push Forge Neo Image

# รันอัตโนมัติทุกครั้งที่ push โค้ดเข้า branch main
# หรือกดรันเองได้จากแท็บ Actions บน GitHub (workflow_dispatch)
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "scripts/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ไม่มี secret ของ CivitAI/ngrok อยู่ใน workflow นี้เลย — ไม่จำเป็นต้องใช้ตอน build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/forge-neo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/forge-neo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
